<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <header class="header">
      <img class="header-img" src="./eisenhower-matrix.jpg" alt="the eisenhower matrix">
      <a
        class="readmore"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
      <h1 class="header-title">Todo App</h1>
    </header>
    <main class="main">
      <section class="section">
        <h2 class="section-title">Add Item</h2>
        <label class="task-label" for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task task-input" type="text">
          <button class="add">Add</button>
        </div>
      </section>
      <section class="section">
        <h2 class="title">Todo</h2>
        <ul class="task-list" id="incomplete">
          <li class="task-row">
            <input class="checkbox" type="checkbox">
            <label class="task task-label">Pay Bills</label>
            <input class="task task-input" type="text">
            <button class="edit">Edit</button>
            <button class="delete"><img class="delete-img" src="./remove.svg" alt="delete"></button>
          </li>
          <li class="task-row editmode">
            <input type="checkbox">
            <label class="task task-label">Go Shopping</label>
            <input class="task task-input" type="text" value="Go Shopping">
            <button class="edit">Save</button>
            <button class="delete"><img class="delete-img" src="./remove.svg" alt="delete"></button>
          </li>
        </ul>
      </section>
      <section class="section">
        <h2 class="title">Completed</h2>
        <ul class="task-list" id="completed">
          <li class="task-row">
            <input type="checkbox" checked>
            <label class="task task-label">See the Doctor</label>
            <input class="task task-input" type="text">
            <button class="edit">Edit</button>
            <button class="delete"><img class="delete-img" src="./remove.svg" alt="delete"></button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
